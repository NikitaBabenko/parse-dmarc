# VibeNest single-service deployment. Local Dovecot fixture: compose.dev.yml.
# HTTP_AUTH_PASSWORD is generated/persisted by VibeNest from .env.example.
# For local Compose, supply your own unique password; there is no fallback secret.
services:
  parse-dmarc:
    image: ghcr.io/nikitababenko/parse-dmarc@sha256:e73ce66d56e52a0b48f8f984344686090fc1cb8996958d854c904421ab2b6fef
    expose:
      - "8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_PATH: /data/parse-dmarc.db
      MAILDIR_PATH: /data/maildir
      HTTP_AUTH_USER: "${HTTP_AUTH_USER:-pilot-owner}"
      HTTP_AUTH_PASSWORD: "${HTTP_AUTH_PASSWORD:?Set a unique HTTP_AUTH_PASSWORD of at least 24 characters}"
      VIBENEST_SYNTHETIC_FIXTURE: "true"
      FETCH_INTERVAL: "300"
      PARSE_DMARC_SERVE_ONLY: "false"
      PARSE_DMARC_METRICS: "true"
      GOMEMLIMIT: 180MiB
      GOMAXPROCS: "1"
    volumes:
      - report-data:/data

volumes:
  report-data:
